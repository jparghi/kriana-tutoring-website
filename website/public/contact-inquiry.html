<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact Inquiry Form</title>
  </head>
  <body>
    <form
      name="contact-inquiry"
      method="POST"
      action="/contact/success"
      data-netlify="true"
      netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="contact-inquiry" />
      <input
        type="hidden"
        name="subject"
        data-remove-prefix
        value="New inquiry from %{formName} on %{siteName} (%{submissionId})"
      />

      <p hidden>
        <label>
          Don&apos;t fill this out if you&apos;re human:
          <input name="bot-field" />
        </label>
      </p>

      <label>
        Parent or guardian name
        <input type="text" name="parent_name" />
      </label>

      <label>
        Email address
        <input type="email" name="email" />
      </label>

      <label>
        Phone number
        <input type="tel" name="phone" />
      </label>

      <label>
        Student grade level
        <select name="student_grade">
          <option value="">Select grade range</option>
          <option value="K-2">Kindergarten – Grade 2</option>
          <option value="3-5">Grades 3 – 5</option>
          <option value="6-8">Grades 6 – 8</option>
        </select>
      </label>

      <label>
        Focus area
        <textarea name="focus_area"></textarea>
      </label>

      <label>
        Preferred consultation time
        <input type="text" name="preferred_time" />
      </label>

      <label>
        Inquiry type
        <input type="text" name="inquiry_type" value="contact" />
      </label>
    </form>
  </body>
</html>
