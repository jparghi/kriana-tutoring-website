<!DOCTYPE html>
<html>
  <head><title>Netlify form definitions</title></head>
  <body>
    <!-- Dummy form so Netlify's build bot registers the contact-inquiry form -->
    <form name="contact-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact-inquiry" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input name="parent_name" />
      <input name="email" />
      <input name="phone" />
      <input name="student_grade" />
      <textarea name="focus_area"></textarea>
      <input name="preferred_time" />
      <input name="inquiry_type" />
    </form>
  </body>
</html>
