<svg xmlns="http://www.w3.org/2000/svg" width="4in" height="3in" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Kriana Tutoring folder sticker</title>
  <desc id="desc">Printable 4 by 3 inch folder sticker with Kriana logo, student name and subject lines, phone number, and website.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6fdff" />
      <stop offset="55%" stop-color="#eefbfd" />
      <stop offset="100%" stop-color="#e8f7fb" />
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dff4ff" />
      <stop offset="100%" stop-color="#d9f7f1" />
    </linearGradient>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eefbff" />
      <stop offset="55%" stop-color="#f4fdff" />
      <stop offset="100%" stop-color="#e9fbf6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f2747" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect x="28" y="28" width="1144" height="844" rx="52" fill="url(#bg)" stroke="#d7e7f8" stroke-width="4" filter="url(#shadow)" />
  <path d="M80 28h1040c29 0 52 23 52 52v132H28V80c0-29 23-52 52-52z" fill="url(#header)" />
  <g transform="translate(390 48)">
    <image x="0" y="6" width="122" height="122" href="../images/kriana-logo-icon-large.png" preserveAspectRatio="xMidYMid meet" />
    <text x="162" y="56" fill="#0A2D5A" font-family="Poppins, Avenir, Montserrat, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="8">KRIANA</text>
    <text x="162" y="104" fill="#1F5B99" font-family="Poppins, Avenir, Montserrat, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="8">TUTORING</text>
  </g>
  <text x="600" y="186" text-anchor="middle" fill="#0A2D5A" font-family="Open Sans, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">Building Confidence, One Child at a Time.</text>

  <text x="92" y="304" fill="#18345c" font-family="Open Sans, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="1.2">Student Name</text>
  <line x1="92" y1="352" x2="1108" y2="352" stroke="#18345c" stroke-width="3.5" stroke-linecap="round" />

  <text x="92" y="452" fill="#18345c" font-family="Open Sans, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="1.2">Subject</text>
  <line x1="92" y1="500" x2="1108" y2="500" stroke="#18345c" stroke-width="3.5" stroke-linecap="round" />

  <rect x="92" y="570" width="1016" height="156" rx="30" fill="url(#footerBg)" stroke="#c9e3f8" stroke-width="3" />
  <text x="600" y="630" text-anchor="middle" fill="#18345c" font-family="Open Sans, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="2">KRIANA TUTORING INC</text>
  <text x="600" y="678" text-anchor="middle" fill="#40617f" font-family="Open Sans, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">613-400-6921 | https://krianatutoring.com</text>
</svg>
